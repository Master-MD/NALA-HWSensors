[package]
name = "nala-hwsensors"
version = "2.0.0"
description = "NALA-HWSensors v2.0 — Cross-Platform Hardware Telemetry, Porsche v4 / Sci-Fi / Liquid Glass Skin Engine & sHeriFF SHA-256 Skin-Guard"
authors = ["Master-MD (NALA Project) & Upstream HWSensors Contributors"]
license = "MIT AND GPL-2.0-or-later AND MPL-2.0"
repository = "https://github.com/Master-MD/NALA-HWSensors"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.31"
tauri = { version = "2.0", features = ["tray-icon", "macos-private-api"] }
